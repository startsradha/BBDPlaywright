
  name: BDDPlaywright CI

  on:
    push:
      branches: [main]
    pull_request:
      branches: [main]
    workflow_dispatch:

  jobs:
    test:
      name: Run BDD Tests
      runs-on: ubuntu-latest
      timeout-minutes: 30

      # Connect GitHub Actions to QA environment
      #environment: qa

      # Read QA environment variables and secrets
      #env:
        #TEST_ENV: qa
        #BASE_URL: ${{ vars['BASE_URL'] }}
        #USERNAME: ${{ secrets.USERNAME }}
        #PASSWORD: ${{ secrets.PASSWORD }}

      steps:
        - name: Checkout source code
          uses: actions/checkout@v6

        - name: Setup Node.js
          uses: actions/setup-node@v6
          with:
            node-version: '22'
            cache: npm

        - name: Install dependencies
          run: npm ci

        - name: Install Playwright browsers
          run: npx playwright install --with-deps

        - name: Generate BDD tests
          run: npx bddgen

        - name: Run BDD tests
          run: ENV=dev npx playwright test
          #run: npx playwright test

        - name: Upload test results
          if: always()
          uses: actions/upload-artifact@v5
          with:
            name: bdd-test-results
            path: |
              allure-results/
              allure-report/
              test-results/
              reports/
            if-no-files-found: ignore
            retention-days: 14
